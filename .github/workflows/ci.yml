name: Green MLOps CI

# Demonstrates the CI/CD integration point from the expose's architecture:
# every push/PR lints the pipeline code and runs a fast smoke test (config
# validity, telemetry wrapper import) rather than a full GPU/CPU training
# job, which would be too slow/expensive to run on every commit. Full
# pipeline reproduction is intended to be triggered manually via `dvc repro`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint (syntax errors / undefined names only)
        run: flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run smoke tests
        run: pytest tests/ -v

      - name: Validate DVC pipeline graph
        run: |
          pip install dvc
          dvc dag
